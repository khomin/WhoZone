syntax = "proto2";

package app;

message InitParam {
    repeated string coco_names = 1;
    optional string model_path = 2;
    optional int32 target_width = 3;
    optional int32 target_height = 4;
}

message CameraInfo {
    optional string id = 1;
    optional uint32 sensor_rotation = 2;
    optional bool is_front = 3;
    repeated Size cameraSizes = 4;
    repeated Range fps_ranges = 5;
}

message Camera {
  optional string id = 1;
  optional bool is_front = 2;
  optional uint32 sensor = 3;
  optional Size size = 4;
}

message Range {
    optional uint32 lower = 1;
    optional uint32 upper = 2;
}

message Size {
    optional uint32 width = 1;
    optional uint32 height = 2;
}

message EventWrapper {
    oneof msg {
        DetectionItem detection = 1;
    }
}

message DetectionItem {
    repeated Rect detections = 1;
    repeated int32 class_ids = 2;
    repeated float confidences = 3;
    optional int32 frame_count = 4;
    optional int64 timestamp_ns = 5;
}

message Rect {
    optional int32 x = 1;
    optional int32 y = 2;
    optional int32 width = 3;
    optional int32 height = 4;
}